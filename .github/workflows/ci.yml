name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classical:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install classical and web dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,web]'
      - name: Check classical behavior without optional PyTorch
        run: python -m pytest -q --junitxml=test-results-classical.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classical-python-${{ matrix.python-version }}
          path: test-results-classical.xml

  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-phase2.txt
      - name: Install the recorded Phase 2 environment with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install -r requirements-phase2.txt
          python -m pip check
      - name: Run all classical, neural, research and dashboard tests
        run: python -m pytest -q -W error::DeprecationWarning --junitxml=test-results-phase2.xml
      - name: Ensure optional neural tests actually ran
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('test-results-phase2.xml').getroot()
          suites = list(root.iter('testsuite'))
          assert suites, 'No test suite results were produced'
          assert sum(int(s.attrib.get('skipped', 0)) for s in suites) == 0, 'Phase 2 tests were skipped'
          assert any('deep_learning' in case.attrib.get('classname', '') for case in root.iter('testcase'))
          assert any('phase2_research' in case.attrib.get('classname', '') for case in root.iter('testcase'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-python-3.13
          path: test-results-phase2.xml

  phase2-container:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download and verify the published model bundle
        run: |
          mkdir -p /tmp/phase2-release
          gh release download phase2-research-2026-11-05 --pattern 'air_prediction_phase2.zip*' --dir /tmp/phase2-release
          cd /tmp/phase2-release
          sha256sum --check air_prediction_phase2.zip.sha256
      - name: Restore only evaluated runtime artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          import json
          with ZipFile('/tmp/phase2-release/air_prediction_phase2.zip') as archive:
              manifest = json.loads(archive.read('PACKAGE_MANIFEST.json'))
              for name, digest in manifest['files'].items():
                  if not name.startswith(('artifacts/phase1/', 'artifacts/phase2_research/', 'data/raw/')):
                      continue
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  payload = archive.read(name)
                  assert sha256(payload).hexdigest() == digest, name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(payload)
          PY
      - name: Build and start the production container
        run: |
          docker build -f deployment/phase2/Dockerfile -t aircast-phase2 .
          docker run --detach --name aircast-phase2 --publish 10000:10000 aircast-phase2
      - name: Compare actual Linux HTTP predictions with saved references
        run: python scripts/check_phase2_production.py --url http://127.0.0.1:10000 --output artifacts/phase2_production/container-verification.json
      - name: Collect container logs
        if: always()
        run: docker logs aircast-phase2 > container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-container
          path: |
            artifacts/phase2_production/container-verification.json
            container.log
