# Timestamp boundaries refer to TARGET times, in Beijing local time.
horizon_hours = 1
seasonal_period_hours = 24
lags = [0, 1, 2, 3, 6, 12, 24, 48, 72, 168]
rolling_windows = [3, 6, 12, 24, 72, 168]
train_start = "2010-01-01"
validation_start = "2013-01-01"
holdout_start = "2014-01-01"
holdout_end = "2015-01-01"
fold_months = 3
minimum_training_rows = 1000
random_seed = 42
threads = 2

# Select by pooled validation RMSE. No early stopping on the holdout.
[[xgboost_candidates]]
n_estimators = 300
max_depth = 3
learning_rate = 0.05
min_child_weight = 5
subsample = 0.8
colsample_bytree = 0.9
reg_lambda = 5.0

