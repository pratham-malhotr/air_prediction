[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-prediction"
version = "0.1.0"
description = "CSAI Project 19: reproducible Phase 1 PM2.5 forecasting"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "matplotlib>=3.9,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
air-prediction = "air_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

